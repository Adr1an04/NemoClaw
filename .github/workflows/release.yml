# Stage a release from a semver tag such as v0.1.0-rc1 on the v1 branch. Promote
# the images CI checked on the tagged history to v1/<image>:<tag>, build the runtime
# images, and create a draft release listing every digest. Nothing here makes a
# package or the release public, and nothing pushes to a package an
# administrator hasn't created as internal: packages a workflow creates inherit
# this public repository's visibility.
name: Release / Stage
on:
  push:
    tags: ["v0.1.*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CI_PACKAGE: ghcr.io/nvidia/nemoclaw/v1-ci
  RELEASE_NAMESPACE: ghcr.io/nvidia/nemoclaw/v1
jobs:
  select:
    name: Select checked images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      source: ${{ steps.select.outputs.source }}
      rebuild: ${{ steps.select.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # CI pushes each checked v1 commit's images; later commits that can't
      # affect the images reuse them, as the image workflow itself does.
      - name: Find the latest checked commit whose images still apply
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          source=
          for commit in $(git rev-list --first-parent --max-count=200 "$GITHUB_SHA"); do
            # The checked images push the proxy last, so its tags mark a complete push.
            if docker buildx imagetools inspect "$CI_PACKAGE:ollama-proxy-$commit-arm64" > /dev/null 2>&1 &&
              docker buildx imagetools inspect "$CI_PACKAGE:ollama-proxy-$commit-amd64" > /dev/null 2>&1; then
              source=$commit
              break
            fi
          done
          docker logout ghcr.io
          rebuild=true
          if [ -n "$source" ]; then
            decision=$(cargo run --locked --quiet -p nemoclaw-build --no-default-features --target-dir target/ci-runner -- \
              changes images --base "$source")
            [ "$decision" = images=false ] && rebuild=false
          fi
          [ "$rebuild" = true ] && source=$GITHUB_SHA
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "Agent and proxy images from \`$source\`; rebuilt: $rebuild." >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: select
    if: needs.select.outputs.rebuild == 'true'
    name: Build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      plan: success
      run: true
      push: true
  # Runtime images build reproducibly for each host's platform, so building
  # them at the tag yields the digests any rebuild of these sources would.
  runtimes:
    name: Runtimes / ${{ matrix.platform }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: linux_amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require internal packages
        uses: ./.github/actions/internal-packages
        with:
          namespace: ghcr.io/nvidia/nemoclaw
          names: v1-ci
          required: "true"
          token: ${{ github.token }}
      - name: Build and push the vLLM and Ollama runtime images
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$GITHUB_SHA-${PLATFORM#linux_}"
          output='type=image,push=true,rewrite-timestamp=true'
          docker buildx bake runtimes \
            --set "vllm.tags=$CI_PACKAGE:vllm-$tag" --set "vllm.output=$output" \
            --set "ollama.tags=$CI_PACKAGE:ollama-$tag" --set "ollama.output=$output"
          docker logout ghcr.io
  stage:
    name: Stage the release
    outputs:
      sboms: ${{ steps.draft.outputs.sboms }}
    needs: [select, build, runtimes]
    if: >-
      !cancelled() && needs.select.result == 'success' && needs.runtimes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          syft-version: v1.55.0
      - name: List the release images
        id: images
        run: |
          agents=$(docker buildx bake --print agents | jq -er '.target | keys[]' | xargs)
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "names=$agents ollama-proxy vllm ollama" >> "$GITHUB_OUTPUT"
      - name: Require internal packages
        uses: ./.github/actions/internal-packages
        with:
          namespace: ${{ env.RELEASE_NAMESPACE }}
          names: ${{ steps.images.outputs.names }}
          required: "true"
          token: ${{ github.token }}
      - name: Join each image's platforms and draft the release
        id: draft
        env:
          NAMES: ${{ steps.images.outputs.names }}
          AGENTS: ${{ steps.images.outputs.agents }}
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.select.outputs.source }}
          TAG: ${{ github.ref_name }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          notes="$RUNNER_TEMP/notes.md"
          bundles="$RUNNER_TEMP/bundles"
          mkdir "$bundles"
          inventory="$RUNNER_TEMP/inventory.json"
          echo '[]' > "$inventory"
          {
            echo "Staged from \`$GITHUB_SHA\`. The agent and proxy images are the ones CI checked at \`$SOURCE\`."
            echo
            echo "A Kubernetes sandbox names its agent image's metadata bundle in \`image.metadata\`; each one is attached to this release."
            echo
            echo "| Image | Reference | Kubernetes metadata |"
            echo "|---|---|---|"
          } > "$notes"
          for image in $NAMES; do
            case "$image" in
              vllm|ollama) from=$GITHUB_SHA ;;
              *) from=$SOURCE ;;
            esac
            target="$RELEASE_NAMESPACE/$image:$TAG"
            docker buildx imagetools create --tag "$target" \
              "$CI_PACKAGE:$image-$from-arm64" "$CI_PACKAGE:$image-$from-amd64"
            digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
            docker buildx imagetools inspect "$RELEASE_NAMESPACE/$image@$digest" --raw > "$RUNNER_TEMP/index.json"
            jq --arg name "$image" --arg repository "$RELEASE_NAMESPACE/$image" \
              --slurpfile manifests "$RUNNER_TEMP/index.json" \
              '. + [{name: $name, repository: $repository, manifests: $manifests[0]}]' \
              "$inventory" > "$inventory.next"
            mv "$inventory.next" "$inventory"
            metadata=-
            # Each agent image's bundle covers both platforms of its index.
            case " $AGENTS " in *" $image "*) agent=true ;; *) agent=false ;; esac
            if [ "$agent" = true ]; then
              NEMOCLAW_REGISTRY_USERNAME="$GITHUB_ACTOR" NEMOCLAW_REGISTRY_PASSWORD="$GH_TOKEN" \
                cargo run --locked -q -p nemoclaw-build --no-default-features -- \
                images export-metadata --registry "$RELEASE_NAMESPACE/$image@$digest" \
                --output "$bundles/$image.metadata.json"
              metadata="\`$image.metadata.json\`"
            fi
            echo "| \`$image\` | \`$RELEASE_NAMESPACE/$image@$digest\` | $metadata |" >> "$notes"
          done
          # The scanner reads immutable child manifests, including images reused
          # from earlier CI. Nothing rebuilds or rewrites an image for its SBOM.
          sboms="$RUNNER_TEMP/sboms"
          cargo run --locked -q -p nemoclaw-build --no-default-features -- \
            release-sboms --inventory "$inventory" --output "$sboms" --syft "$SYFT" \
            > "$RUNNER_TEMP/sbom-matrix.json"
          echo "sboms=$(jq -c '{include: .}' "$RUNNER_TEMP/sbom-matrix.json")" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '## Software bills of materials'
            echo
            cat <<'NOTES'
          Each platform has an SPDX JSON asset. `sboms.json` records the image, platform, digest, asset and SHA-256. Attestations require a separate approval in this run; a draft alone does not establish that they exist.
          NOTES
            echo
            echo '| Platform | Image reference | SPDX asset |'
            echo '|---|---|---|'
            jq -r '.[] | "| `\(.platform)` | `\(.reference)` | `\(.asset)` |"' "$sboms/sboms.json"
          } >> "$notes"
          docker logout ghcr.io
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$TAG is already published; stage a new tag instead"
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $prerelease --verify-tag \
              --title "NemoClaw $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$bundles"/*.metadata.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$sboms"/*.spdx.json "$sboms/sboms.json"
  approve-sboms:
    name: Approve public SBOM attestations
    needs: stage
    runs-on: ubuntu-24.04
    environment: v1-release-attestations
    permissions:
      contents: read
    steps:
      # Public-repository attestations use public Sigstore even for internal
      # packages. An unprotected or newly auto-created environment must fail.
      - name: Require configured reviewers before emitting public metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          protected=$(gh api "repos/$GITHUB_REPOSITORY/environments/v1-release-attestations" \
            --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))')
          if [ "$protected" != true ]; then
            echo '::error::Configure required reviewers on v1-release-attestations before approving public SBOM attestations'
            exit 1
          fi
  attest-sboms:
    name: Attest / ${{ matrix.asset }}
    needs: [stage, approve-sboms]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.stage.outputs.sboms) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the exact staged asset and check its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/sbom"
          cd "$RUNNER_TEMP/sbom"
          printf '%s  %s\n' "$SHA256" "$ASSET" | sha256sum --check --strict
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Attach the SPDX predicate to the platform digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: ${{ runner.temp }}/sbom/${{ matrix.asset }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the SPDX attestation and unchanged subject
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ matrix.reference }}
          DIGEST: ${{ matrix.digest }}
        run: |
          gh attestation verify "oci://$REFERENCE" --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://spdx.dev/Document/v2.3
          actual=$(docker buildx imagetools inspect "$REFERENCE" --format '{{.Manifest.Digest}}')
          test "$actual" = "$DIGEST"
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io
